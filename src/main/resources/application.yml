# Default profile: PostgreSQL, everything from environment variables (Docker Compose runtime).
# JWT_SECRET has no default on purpose, so no weak secret ships in the default profile.
# JwtProperties validates it at startup: a missing secret or one shorter than 32 characters stops the app.
app:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:480}
  scheduler:
    delay-check:
      enabled: ${DELAY_CHECK_ENABLED:true}
      interval-ms: ${DELAY_CHECK_INTERVAL_MS:60000}
      grace-minutes: ${DELAY_CHECK_GRACE_MINUTES:0}
  notifications:
    channels: ${NOTIFICATION_CHANNELS:log}

spring:
  application:
    name: trekops
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/trekops}
    username: ${DB_USER:trekops}
    password: ${DB_PASSWORD:trekops}
    hikari:
      # Fail fast when the database is unreachable instead of waiting the 30 second default.
      connection-timeout: 5000
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

---
# local profile: run from the IDE against a PostgreSQL on localhost.
# Start one with: docker run --rm -p 5432:5432 -e POSTGRES_DB=trekops -e POSTGRES_USER=trekops -e POSTGRES_PASSWORD=trekops postgres:16
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trekops}

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-secret-local-dev-secret-0123456789}

---
# test profile: H2 in memory in PostgreSQL mode. Used by ./gradlew test.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:trekops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

app:
  security:
    jwt-secret: test-secret-test-secret-test-secret-0123456789
  scheduler:
    delay-check:
      enabled: false
